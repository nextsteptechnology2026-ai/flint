# Publica una release con binarios ya compilados cuando se empuja una
# etiqueta `vX.Y.Z`. Quien la instale no necesita tener Rust: para eso están
# el `.deb` (Debian/Ubuntu/Kali), los tar.gz con el binario suelto para Linux
# y macOS, y el instalador de una línea que elige el que corresponde.
#
# Igual que el CI, sin acciones de terceros: `gh` ya viene instalado en el
# runner y se autentica con el token del propio workflow.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  # Necesario para crear la release y subirle archivos.
  contents: write

jobs:
  # Una etiqueta v0.1.4 sobre un Cargo.toml que dice 0.1.3 publicaría un
  # paquete cuyo nombre y versión interna no coinciden con la release. Se
  # revisa una sola vez, antes de compilar nada: fallar acá cuesta segundos,
  # fallar después de tres compilaciones cuesta diez minutos.
  verificar:
    name: La etiqueta coincide con Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME dice $version y Cargo.toml dice $cargo_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  construir:
    name: Compilar (${{ matrix.nombre }})
    needs: verificar
    runs-on: ${{ matrix.runner }}
    strategy:
      # Que falle uno no cancela a los otros: así una release a medias se ve
      # entera en el log en vez de descubrir los problemas de a uno.
      fail-fast: false
      matrix:
        include:
          - nombre: x86_64-linux
            runner: ubuntu-latest
            deb: true
          # Runner ARM de GitHub, gratis para repositorios públicos.
          - nombre: aarch64-linux
            runner: ubuntu-24.04-arm
            deb: true
          - nombre: x86_64-macos
            runner: macos-15-intel
            deb: false
          - nombre: aarch64-macos
            runner: macos-14
            deb: false
    env:
      VERSION: ${{ needs.verificar.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # La versión de rust-toolchain.toml, la misma en las tres plataformas.
      - name: Toolchain
        run: rustup toolchain install

      # No se publica algo que no pasa sus propias pruebas, y se prueban en
      # cada plataforma: las gramáticas de tree-sitter son C compilado acá.
      - name: Tests
        run: cargo test --locked

      # dpkg-shlibdeps calcula las dependencias del paquete. La imagen x86
      # lo trae; la ARM no está garantizado.
      - name: Construir el .deb
        if: matrix.deb
        run: |
          command -v dpkg-shlibdeps >/dev/null || sudo apt-get install -y dpkg-dev
          bash packaging/build-deb.sh

      # El .deb solo sirve en Debian y derivadas; el tar.gz es para todo lo
      # demás (packaging/tarball.sh). Los dos se arman con el mismo entorno
      # reproducible (packaging/reproducible.sh).
      - name: Empaquetar el binario suelto
        run: |
          bash packaging/tarball.sh "$VERSION" "${{ matrix.nombre }}"
          if [ "${{ matrix.deb }}" = "true" ]; then
            cp target/deb/flint_*.deb dist/
          fi
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.nombre }}
          path: dist/
          if-no-files-found: error

  publicar:
    name: Publicar la release
    needs: [verificar, construir]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verificar.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bajados
          merge-multiple: true

      - name: Juntar todo y calcular los sha256
        run: |
          mkdir -p dist
          find bajados -type f -exec cp {} dist/ \;
          cd dist
          sha256sum ./* > sha256sums.txt
          cat sha256sums.txt

      # La fórmula de Homebrew se genera acá y no a mano: necesita el sha256
      # de cada tar.gz, que recién existe ahora. Sale como archivo de la
      # release y además se sube a Formula/flint.rb en main (paso final).
      - name: Generar la fórmula de Homebrew
        run: bash packaging/homebrew-formula.sh "$VERSION" dist > dist/flint.rb

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Flint $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*

      # El tap de Homebrew es este mismo repositorio: `brew update` lee
      # Formula/flint.rb de main. Va después de publicar a propósito, porque
      # una fórmula que apunta a tar.gz que todavía no existen rompe el
      # install de todos. El checkout está en la etiqueta, no en main, así
      # que se baja main, se reemplaza el archivo y se sube.
      - name: Actualizar la fórmula en main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp dist/flint.rb Formula/flint.rb
          if git diff --quiet -- Formula/flint.rb; then
            echo "La fórmula en main ya está al día"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fórmula de Homebrew para $GITHUB_REF_NAME" -- Formula/flint.rb
          git push origin main
